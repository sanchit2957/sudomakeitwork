services:
  - type: web
    name: assam-rescue-platform
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_APP_TITLE
        value: sudo MakeItWork
      - key: JWT_SECRET
        generateValue: true
      - key: VAPID_SUBJECT
        value: mailto:admin@assamrescue.gov.in
      - key: VAPID_PUBLIC_KEY
        sync:false
      - key: VAPID_PRIVATE_KEY
        sync:false
